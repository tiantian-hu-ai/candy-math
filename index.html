<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图形代换小侦探 · 等量代换动画讲解</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:#faf7f2; color:#3a3a3a; padding:18px 12px 60px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { text-align:center; font-size:26px; color:#4a3b8c; margin-bottom:6px; }
  .tag { text-align:center; font-size:14px; color:#8a7fb0; margin-bottom:14px; }
  .intro { background:#fff; border:2px dashed #c9bfe8; border-radius:14px;
    padding:10px 14px; font-size:15px; color:#6b5fa8; text-align:center; margin-bottom:16px; }
  .card { background:#fff; border-radius:16px; padding:16px 14px;
    box-shadow:0 2px 10px rgba(90,70,160,.10); margin-bottom:18px; }
  .card h2 { font-size:19px; color:#4a3b8c; margin-bottom:10px; }
  .problem-text { font-size:16px; color:#444; background:#f6f3ff;
    border-radius:10px; padding:10px 12px; margin-bottom:12px; line-height:1.7; }

  /* ===== 舞台 ===== */
  .stage { border:2px solid #e3dcf5; border-radius:14px; padding:12px; background:#fcfbff; }
  .eqs { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .eq { font-size:20px; font-weight:bold; color:#555; background:#f1eefb;
    border-radius:8px; padding:7px 10px; letter-spacing:2px;
    transition:background .3s, color .3s, transform .3s; }
  .eq.hl { background:#ffe9a8; color:#8a5a00; transform:scale(1.03); }
  .eq.done { background:#e2f6e6; color:#1e7a3c; }
  .tokens { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  .token { width:62px; height:62px; border-radius:50%; background:#fff;
    border:3px solid #ccc; display:flex; flex-direction:column;
    align-items:center; justify-content:center; transition:transform .3s; }
  .token .sym { font-size:20px; font-weight:bold; color:#888; line-height:1; }
  .token .val { font-size:19px; font-weight:bold; color:#bbb; line-height:1; margin-top:3px; }
  .token.solved { transform:scale(1.12); }
  .token.solved .val { color:inherit; animation:pop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0%{transform:scale(0);} 100%{transform:scale(1);} }
  .subtitle { font-size:16px; color:#333; min-height:44px; line-height:1.6;
    background:#fff8e6; border-radius:10px; padding:8px 10px; margin-bottom:8px; }
  .calc { font-size:17px; font-weight:bold; color:#1e5fa8; background:#e8f1fd;
    border-radius:10px; padding:8px 10px; min-height:40px; line-height:1.7;
    white-space:pre-line; margin-bottom:10px; }
  .ctrl { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .btn { border:none; border-radius:10px; padding:9px 16px; font-size:15px;
    font-weight:bold; cursor:pointer; color:#fff; background:#7b5fd0; }
  .btn:active { transform:scale(.96); }
  .btn.blue { background:#3d87d6; } .btn.gray { background:#9a93ad; }
  .btn.orange { background:#e8842c; }

  /* ===== 练习题 ===== */
  .p-item { border:1.5px solid #eee5d8; border-radius:12px; padding:10px 12px;
    margin-bottom:12px; background:#fffdf8; }
  .p-head { display:flex; align-items:flex-start; gap:10px; }
  .p-no { min-width:26px; height:26px; border-radius:50%; background:#f0a63a;
    color:#fff; font-size:14px; font-weight:bold; display:flex;
    align-items:center; justify-content:center; margin-top:2px; }
  .p-eqs { flex:1; font-size:17px; font-weight:bold; color:#555;
    letter-spacing:2px; line-height:1.8; }
  .p-btns { display:flex; gap:8px; margin-top:8px; margin-left:36px; flex-wrap:wrap; }
  .p-ans { display:none; margin-top:8px; margin-left:36px; font-size:15px;
    font-weight:bold; color:#1e7a3c; background:#e2f6e6; border-radius:8px; padding:7px 10px; }
  .p-ans.show { display:block; }
  .p-stage { display:none; margin-top:10px; }
  .p-stage.show { display:block; }
  .tip { font-size:13px; color:#999; text-align:center; margin-top:8px; }
  .koujue { text-align:center; font-size:15px; color:#8a5a00; background:#fff3d6;
    border-radius:10px; padding:10px; margin-top:4px; }

  /* ===== 手机适配 ===== */
  @media (max-width:600px){
    body{padding:12px 8px 50px;}
    h1{font-size:21px;} .tag{font-size:12px;} .intro{font-size:13px;}
    .card{padding:12px 10px;} .card h2{font-size:16px;}
    .problem-text{font-size:14px; padding:8px 10px;}
    .eq{font-size:16px; padding:6px 8px; letter-spacing:1px;}
    .token{width:50px; height:50px;} .token .sym{font-size:16px;} .token .val{font-size:15px;}
    .subtitle{font-size:14px; min-height:38px;} .calc{font-size:14px;}
    .btn{padding:8px 12px; font-size:13px;}
    .p-eqs{font-size:15px;} .p-no{min-width:22px; height:22px; font-size:12px;}
    .p-btns,.p-ans,.p-stage{margin-left:0;} .p-ans{font-size:13px;}
  }
  @media (max-width:380px){
    .eq{font-size:14px;} .token{width:42px; height:42px; gap:8px;}
    .tokens{gap:8px;} .calc{font-size:13px;} .subtitle{font-size:13px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 图形代换小侦探</h1>
  <div class="tag">等量代换 · 一年级思维训练</div>
  <div class="intro">图形后面藏着数字！像小侦探一样：<b>先解开一个，再把它带到别的算式里</b>，图形就全部现形啦～</div>

  <section class="card">
    <h2>📘 例题讲解</h2>
    <div class="problem-text">下面算式中的图形各表示几？<br>□ + □ = 12，&nbsp;&nbsp;△ + □ = 17，&nbsp;&nbsp;△ − ☆ − ☆ = 3</div>
    <div id="exStage"></div>
  </section>

  <section class="card">
    <h2>✏️ 练一练（10 题）</h2>
    <div class="tip">点「播放讲解过程」，在这道题下面看动画讲解；随时可点「显示答案」核对</div>
    <div id="practice"></div>
    <div class="koujue">🗣 小口诀：<b>先解「两个一样的」，再把它代进别的算式！</b></div>
  </section>
</div>

<script>
/* ================= 语音 ================= */
let soundOn = true;
function speak(text){
  if(!soundOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/□/g,'方块').replace(/△/g,'三角').replace(/☆/g,'星星').replace(/○/g,'圆圈'));
    u.lang = 'zh-CN'; u.pitch = 1.05; u.rate = 0.92;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= 题目数据 ================= */
const SHAPES = {'□':'#2f7fd1','△':'#e8842c','☆':'#8e5bd1','○':'#2fa35a'};

const EXAMPLE = {
  vars:['□','△','☆'],
  eqs:['□ + □ = 12','△ + □ = 17','△ − ☆ − ☆ = 3'],
  solve:[
    {type:'double',    eq:0, sym:'□', S:12},
    {type:'addSub',    eq:1, sym:'△', T:17, k:'□'},
    {type:'doubleDiff',eq:2, sym:'☆', totalSym:'△', R:3},
  ]
};

const PRACTICE = [
  {vars:['□','☆'], eqs:['☆ − □ = 8','5 + □ = 9'], solve:[
    {type:'addSub',   eq:1, sym:'□', T:9, k:5},
    {type:'symMinus', eq:0, sym:'☆', k:'□', d:8}]},
  {vars:['○','△'], eqs:['○ + ○ = 8','△ + ○ = 10'], solve:[
    {type:'double', eq:0, sym:'○', S:8},
    {type:'addSub', eq:1, sym:'△', T:10, k:'○'}]},
  {vars:['□','△'], eqs:['□ + □ = 10','□ + △ = 9'], solve:[
    {type:'double', eq:0, sym:'□', S:10},
    {type:'addSub', eq:1, sym:'△', T:9, k:'□'}]},
  {vars:['☆','○'], eqs:['☆ + ☆ = 14','☆ + ○ = 12'], solve:[
    {type:'double', eq:0, sym:'☆', S:14},
    {type:'addSub', eq:1, sym:'○', T:12, k:'☆'}]},
  {vars:['△','□'], eqs:['△ + △ = 6','△ + □ = 11'], solve:[
    {type:'double', eq:0, sym:'△', S:6},
    {type:'addSub', eq:1, sym:'□', T:11, k:'△'}]},
  {vars:['○','□'], eqs:['○ + ○ + ○ = 9','○ + □ = 7'], solve:[
    {type:'triple', eq:0, sym:'○', S:9},
    {type:'addSub', eq:1, sym:'□', T:7, k:'○'}]},
  {vars:['□','△','☆'], eqs:['□ + □ = 12','△ + □ = 15','△ − ☆ = 2'], solve:[
    {type:'double',  eq:0, sym:'□', S:12},
    {type:'addSub',  eq:1, sym:'△', T:15, k:'□'},
    {type:'subKnown',eq:2, sym:'☆', k:'△', d:2}]},
  {vars:['○','△','☆'], eqs:['○ + ○ = 16','○ + △ = 11','△ + ☆ = 12'], solve:[
    {type:'double', eq:0, sym:'○', S:16},
    {type:'addSub', eq:1, sym:'△', T:11, k:'○'},
    {type:'addSub', eq:2, sym:'☆', T:12, k:'△'}]},
  {vars:['☆','□','○'], eqs:['☆ + ☆ = 18','□ + ☆ = 13','□ − ○ = 2'], solve:[
    {type:'double',  eq:0, sym:'☆', S:18},
    {type:'addSub',  eq:1, sym:'□', T:13, k:'☆'},
    {type:'subKnown',eq:2, sym:'○', k:'□', d:2}]},
  {vars:['△','○','□'], eqs:['△ + △ = 4','△ + ○ = 12','○ + □ = 15'], solve:[
    {type:'double', eq:0, sym:'△', S:4},
    {type:'addSub', eq:1, sym:'○', T:12, k:'△'},
    {type:'addSub', eq:2, sym:'□', T:15, k:'○'}]},
];

/* ================= 生成讲解步骤 ================= */
function buildSteps(p){
  const known = {};
  const steps = [];
  steps.push({eq:-1, solve:null,
    sub:'下面算式里的图形各表示几？别怕，我们像小侦探一样，一条一条解开！',
    calc:'先找最容易解的算式',
    say:'下面算式里的图形各表示几？别怕，我们像小侦探一样，一条一条解开！'});
  p.solve.forEach(s=>{
    let step;
    if(s.type==='double'){
      const h = s.S/2; known[s.sym]=h;
      step = {sub:`两个 ${s.sym} 一模一样，合起来是 ${s.S}`, solve:[s.sym,h],
        calc:`${h} + ${h} = ${s.S}，所以 ${s.sym} = ${h}`,
        say:`两个${s.sym}一模一样，${h}加${h}等于${s.S}，所以${s.sym}是${h}！`};
    } else if(s.type==='triple'){
      const t = s.S/3; known[s.sym]=t;
      step = {sub:`三个 ${s.sym} 一模一样，合起来是 ${s.S}`, solve:[s.sym,t],
        calc:`${t} + ${t} + ${t} = ${s.S}，所以 ${s.sym} = ${t}`,
        say:`三个${s.sym}一模一样，${t}加${t}再加${t}等于${s.S}，所以${s.sym}是${t}！`};
    } else if(s.type==='addSub'){
      const kv = (typeof s.k==='number') ? s.k : known[s.k];
      const x = s.T - kv; known[s.sym]=x;
      step = {sub:`把 ${s.k} 换成 ${kv}：${s.sym} + ${kv} = ${s.T}`, solve:[s.sym,x],
        calc:`${s.T} − ${kv} = ${x}，所以 ${s.sym} = ${x}`,
        say:`${s.sym}加${kv}等于${s.T}，用${s.T}减${kv}，等于${x}，所以${s.sym}是${x}！`};
    } else if(s.type==='subKnown'){
      const kv = (typeof s.k==='number') ? s.k : known[s.k];
      const x = kv - s.d; known[s.sym]=x;
      step = {sub:`把 ${s.k} 换成 ${kv}：${kv} − ${s.sym} = ${s.d}`, solve:[s.sym,x],
        calc:`${kv} − ${s.d} = ${x}，所以 ${s.sym} = ${x}`,
        say:`${kv}减去${s.sym}还剩${s.d}，所以${s.sym}是${kv}减${s.d}，等于${x}！`};
    } else if(s.type==='symMinus'){
      const kv = (typeof s.k==='number') ? s.k : known[s.k];
      const x = kv + s.d; known[s.sym]=x;
      step = {sub:`把 ${s.k} 换成 ${kv}：${s.sym} − ${kv} = ${s.d}`, solve:[s.sym,x],
        calc:`${kv} + ${s.d} = ${x}，所以 ${s.sym} = ${x}`,
        say:`${s.sym}减去${kv}还剩${s.d}，所以${s.sym}是${kv}加${s.d}，等于${x}！`};
    } else if(s.type==='doubleDiff'){
      const T = known[s.totalSym];
      const S = T - s.R, h = S/2; known[s.sym]=h;
      step = {sub:`把 ${s.totalSym} 换成 ${T}：${T} − ${s.sym} − ${s.sym} = ${s.R}`, solve:[s.sym,h],
        calc:`两个 ${s.sym} 合起来：${T} − ${s.R} = ${S}\n${h} + ${h} = ${S}，所以 ${s.sym} = ${h}`,
        say:`${s.totalSym}是${T}，从${T}减到${s.R}，一共减掉了${S}，两个${s.sym}合起来就是${S}。${h}加${h}等于${S}，所以${s.sym}是${h}！`};
    }
    step.eq = s.eq;
    steps.push(step);
  });
  const summary = p.vars.map(v=>`${v} = ${known[v]}`).join('，');
  steps.push({eq:-2, solve:'all',
    sub:`全部解开啦！${summary}`,
    calc:`${summary}\n小侦探口诀：先解「两个一样的」，再代进别的算式！`,
    say:`全部解开啦！${p.vars.map(v=>`${v}是${known[v]}`).join('，')}。记住小口诀：先解两个一样的，再代进别的算式！`});
  return {steps, known};
}

/* ================= 播放器组件 ================= */
function makePlayer(mount, p){
  const {steps, known} = buildSteps(p);
  mount.innerHTML = `
    <div class="stage">
      <div class="eqs">${p.eqs.map((e,i)=>`<div class="eq" data-i="${i}">${e}</div>`).join('')}</div>
      <div class="tokens">${p.vars.map(v=>`
        <span class="token" data-sym="${v}" style="border-color:${SHAPES[v]}88">
          <b class="sym" style="color:${SHAPES[v]}">${v}</b><b class="val">?</b>
        </span>`).join('')}</div>
      <div class="subtitle"></div>
      <div class="calc"></div>
      <div class="ctrl">
        <button class="btn play">▶ 播放讲解（带语音）</button>
        <button class="btn blue next">下一步</button>
        <button class="btn gray reset">↺ 重来</button>
        <button class="btn orange snd">🔊 声音开</button>
      </div>
    </div>`;
  const q = sel => mount.querySelector(sel);
  const eqEls = mount.querySelectorAll('.eq');
  const tokEls = mount.querySelectorAll('.token');
  let idx = -1, timer = null, playing = false;

  function show(i){
    eqEls.forEach(el=>el.classList.remove('hl'));
    if(i<0){ q('.subtitle').textContent='点「播放讲解」或「下一步」，跟着动画一起破案～';
      q('.calc').textContent=''; return; }
    const st = steps[i];
    if(st.eq>=0) eqEls[st.eq].classList.add('hl');
    if(st.eq===-2) eqEls.forEach(el=>el.classList.add('done'));
    q('.subtitle').textContent = st.sub;
    q('.calc').textContent = st.calc;
    if(st.solve==='all'){
      tokEls.forEach(t=>t.classList.add('solved'));
    } else if(st.solve){
      const t = mount.querySelector(`.token[data-sym="${st.solve[0]}"]`);
      t.classList.add('solved');
      t.querySelector('.val').textContent = st.solve[1];
    }
    speak(st.say);
  }
  function next(){
    if(idx >= steps.length-1) return;
    idx++; show(idx);
  }
  function reset(){
    stopPlay(); idx = -1;
    tokEls.forEach(t=>{t.classList.remove('solved'); t.querySelector('.val').textContent='?';});
    eqEls.forEach(el=>el.classList.remove('hl','done'));
    show(-1);
  }
  function stopPlay(){
    if(timer){ clearInterval(timer); timer=null; }
    if(playing){ playing=false; q('.play').textContent='▶ 播放讲解（带语音）'; }
    if('speechSynthesis' in window) try{speechSynthesis.cancel();}catch(e){}
  }
  function play(){
    if(playing){ stopPlay(); return; }
    if(idx >= steps.length-1) reset();
    playing = true; q('.play').textContent='⏸ 暂停';
    next();
    timer = setInterval(()=>{ if(idx>=steps.length-1){ stopPlay(); } else next(); }, 4200);
  }
  q('.play').addEventListener('click', play);
  q('.next').addEventListener('click', ()=>{ stopPlay(); next(); });
  q('.reset').addEventListener('click', reset);
  q('.snd').addEventListener('click', function(){
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔊 声音开' : '🔇 声音关';
    if(!soundOn && 'speechSynthesis' in window) try{speechSynthesis.cancel();}catch(e){}
  });
  show(-1);
  return {steps, known};
}

/* ================= 渲染页面 ================= */
makePlayer(document.getElementById('exStage'), EXAMPLE);

const prWrap = document.getElementById('practice');
let openStage = null;
PRACTICE.forEach((p,i)=>{
  const ans = buildSteps(p).known;
  const ansText = p.vars.map(v=>`${v} = ${ans[v]}`).join('，');
  const item = document.createElement('div');
  item.className = 'p-item';
  item.innerHTML = `
    <div class="p-head">
      <span class="p-no">${i+1}</span>
      <div class="p-eqs">${p.eqs.join('<br>')}</div>
    </div>
    <div class="p-btns">
      <button class="btn playBtn">▶ 播放讲解过程</button>
      <button class="btn blue ansBtn">显示答案</button>
    </div>
    <div class="p-ans">${ansText}</div>
    <div class="p-stage"></div>`;
  prWrap.appendChild(item);
  const stage = item.querySelector('.p-stage');
  const playBtn = item.querySelector('.playBtn');
  const ansBtn = item.querySelector('.ansBtn');
  let player = null;
  playBtn.addEventListener('click', ()=>{
    if(stage.classList.contains('show')){
      stage.classList.remove('show'); playBtn.textContent='▶ 播放讲解过程';
      if('speechSynthesis' in window) try{speechSynthesis.cancel();}catch(e){}
      return;
    }
    if(openStage && openStage!==stage){
      openStage.classList.remove('show');
      openStage.parentNode.querySelector('.playBtn').textContent='▶ 播放讲解过程';
    }
    openStage = stage;
    if(!player) player = makePlayer(stage, p);
    stage.classList.add('show');
    playBtn.textContent='■ 收起讲解';
    stage.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
  ansBtn.addEventListener('click', function(){
    const a = item.querySelector('.p-ans');
    a.classList.toggle('show');
    this.textContent = a.classList.contains('show') ? '隐藏答案' : '显示答案';
  });
});
</script>
</body>
</html>
